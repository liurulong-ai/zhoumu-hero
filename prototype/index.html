<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素勇者 · ARPG 原型</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #14141c;
    color: #cfd2dd;
    font-family: "PingFang SC", "Microsoft YaHei", monospace, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px;
  }
  h1 { font-size: 18px; letter-spacing: 4px; color: #ffd76e; margin: 6px 0 2px; text-shadow: 0 2px 0 #7a5b13; }
  .sub { font-size: 12px; color: #8a8fa3; margin-bottom: 10px; }
  #wrap { position: relative; line-height: 0; border: 3px solid #3a3f55; border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #1a2417; }
  .hint { margin-top: 10px; font-size: 12px; color: #8a8fa3; text-align: center; line-height: 1.8; }
  .hint b { color: #ffd76e; font-weight: normal; }
  kbd { background: #262a3a; border: 1px solid #454b66; border-bottom-width: 2px; border-radius: 3px; padding: 1px 6px; font-size: 11px; color: #e8eaf2; }
</style>
</head>
<body>
<h1>周 目 勇 者</h1>
<div class="sub">像素风动作 RPG · 可玩原型 v0.1</div>
<div id="wrap"><canvas id="cv" width="480" height="270"></canvas></div>
<div class="hint">
  <kbd>W A S D</kbd> / 方向键 移动 · <kbd>J</kbd> / <kbd>空格</kbd> / 鼠标点击 攻击 · <kbd>Shift</kbd> 翻滚闪避<br>
  击杀史莱姆获得经验与金币，<b>Lv.3 升级变强</b>，击杀 <b>12 只</b>后史莱姆王现身 —— 击败它通关！
</div>
<script>
'use strict';
/* ============================================================
   周目勇者 —— 像素风动作 RPG 单文件原型
   迁移到 Unity 时的对应关系：
   - Player/Slime/Boss  -> MonoBehaviour + FSM 状态机
   - ItemSO/EnemySO     -> ScriptableObject 配置
   - SaveSystem         -> Application.persistentDataPath + JSON
   ============================================================ */

// ---------- 基础 ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 480, H = 270;

function fitScale() {
  const s = Math.max(1, Math.min(
    Math.floor((innerWidth - 40) / W),
    Math.floor((innerHeight - 120) / H)));
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fitScale); fitScale();

// ---------- 音效（WebAudio 合成，无外部资源） ----------
let AC = null;
function beep(f0, f1, dur, type = 'square', vol = 0.08) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const SFX = {
  swing : () => beep(320, 140, .07, 'triangle', .05),
  hit   : () => beep(220, 90,  .09, 'square',   .07),
  hurt  : () => beep(160, 55,  .18, 'sawtooth', .09),
  pickup: () => beep(660, 990, .07, 'sine',     .06),
  coin  : () => beep(880, 1320,.06, 'square',   .05),
  level : () => { beep(523,523,.09,'square',.06); setTimeout(()=>beep(659,659,.09,'square',.06),90); setTimeout(()=>beep(784,784,.14,'square',.07),180); },
  boss  : () => { beep(110,80,.4,'sawtooth',.1); setTimeout(()=>beep(98,70,.5,'sawtooth',.1),300); },
  win   : () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,f,.16,'square',.07), i*140)); },
};

// ---------- 像素精灵 ----------
const PAL = {
  b:'#7d9bc4', B:'#55719a', f:'#f2c9a0', e:'#26262e', m:'#9aa7c4', M:'#68739b',
  s:'#f2c9a0', w:'#8a5a33', l:'#3c4257', k:'#26262e',
  g:'#7fd45c', G:'#4e9438', d:'#35682a',
  r:'#e8483c', R:'#a52c22',
  y:'#ffd76e', Y:'#c79a2a',
  c:'#5cd8d8', C:'#2f9a9a',
  t:'#2f6b33', T:'#1f4a24', o:'#7a5230', O:'#5b3b21',
  x:'#8d939f', X:'#5f6570',
};
function makeSprite(rows) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch !== '.') { g.fillStyle = PAL[ch] || '#f0f'; g.fillRect(x, y, 1, 1); }
  }
  return c;
}
const SPR = {};
SPR.player = makeSprite([
  '....bbbb....',
  '...bbbbbb...',
  '...BffffB...',
  '...BfefeB...',
  '...BffffB...',
  '....bbbb....',
  '...mmmmmm...',
  '..mmmmmmmm..',
  '.smmMMMMmms.',
  '..smmmmmms..',
  '...wwwwww...',
  '...ll..ll...',
  '...ll..ll...',
  '...kk..kk...',
]);
SPR.slime = makeSprite([
  '..gggggg..',
  '.gggggggg.',
  'ggeggggegg',
  'ggeggggegg',
  'gggggggggg',
  'gGGGGGGGGg',
  '.GGGGGGGG.',
  '..GddddG..',
]);
// 生成纯白剪影版（受击闪白用）
function whiteOf(spr) {
  const c = document.createElement('canvas');
  c.width = spr.width; c.height = spr.height;
  const g = c.getContext('2d');
  g.drawImage(spr, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
SPR.slimeW = whiteOf(SPR.slime);
SPR.heart = makeSprite([
  '.rr.rr.',
  'rrrrrrr',
  'rRrrrRr',
  '.rrrrr.',
  '..rrr..',
  '...r...',
]);
SPR.coin = makeSprite([
  '.yyyy.',
  'yyYyyy',
  'yYyyyy',
  'yyYyyy',
  'yyyyYy',
  '.yyyy.',
]);
SPR.gem = makeSprite([
  '..cc..',
  '.cccc.',
  'cCccCc',
  '.cCCc.',
  '..cc..',
]);
SPR.tree = makeSprite([
  '.....tttt.......',
  '...tttttttt.....',
  '..ttttTTtttt....',
  '.ttttTTTTtttt...',
  '.ttTTttttTTtt...',
  'tttTttttttTttt..',
  'tttttttttttttt..',
  '.tttttttttttt...',
  '..tttttttttt....',
  '...tttttttt.....',
  '.....oooo.......',
  '.....oooo.......',
  '.....OoOo.......',
  '....OooooO......',
]);
SPR.rock = makeSprite([
  '..xxxx...',
  '.xxxXXx..',
  'xxxXXXXx.',
  'xxXXXXXx.',
  'xXXXXXXx.',
  '.XXXXXX..',
  '..XXXX...',
]);

// ---------- 存档 ----------
const SAVE_KEY = 'arpg_proto_save_v1';
function loadSave() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; }
  catch (e) { return null; }
}
function writeSave() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      level: P.level, xp: P.xp, coins: P.coins, kills: G.kills,
      bossDead: G.bossDead, playTime: G.playTime,
    }));
  } catch (e) {}
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// ---------- 世界地图 ----------
const TILE = 16, MAPW = 56, MAPH = 40;
const WORLD_W = MAPW * TILE, WORLD_H = MAPH * TILE;
const mapCanvas = document.createElement('canvas');
mapCanvas.width = WORLD_W; mapCanvas.height = WORLD_H;
const solid = new Uint8Array(MAPW * MAPH);
const decos = []; // {spr, x, y} 非碰撞装饰

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildMap() {
  const rnd = mulberry32(20260905);
  const g = mapCanvas.getContext('2d');
  // 草地底色（棋盘微差）
  for (let ty = 0; ty < MAPH; ty++) for (let tx = 0; tx < MAPW; tx++) {
    g.fillStyle = (tx + ty) % 2 ? '#2c4a26' : '#2f5029';
    g.fillRect(tx * TILE, ty * TILE, TILE, TILE);
  }
  const S = (tx, ty) => ty * MAPW + tx;
  const clearAround = (cx, cy, r) => {
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++)
      if (x > 1 && y > 1 && x < MAPW - 2 && y < MAPH - 2) solid[S(x, y)] = 0;
  };
  // 边界树林
  for (let x = 0; x < MAPW; x++) for (let y = 0; y < MAPH; y++)
    if (x < 2 || y < 2 || x >= MAPW - 2 || y >= MAPH - 2) solid[S(x, y)] = 1;
  // 散落树 / 石头
  let placed = 0, guard = 0;
  while (placed < 80 && guard++ < 2000) {
    const tx = 2 + Math.floor(rnd() * (MAPW - 4)), ty = 2 + Math.floor(rnd() * (MAPH - 4));
    if (solid[S(tx, ty)]) continue;
    solid[S(tx, ty)] = 1;
    decos.push({ spr: 'tree', x: tx * TILE - 1, y: ty * TILE - 6 });
    placed++;
  }
  placed = 0; guard = 0;
  while (placed < 30 && guard++ < 1000) {
    const tx = 2 + Math.floor(rnd() * (MAPW - 4)), ty = 2 + Math.floor(rnd() * (MAPH - 4));
    if (solid[S(tx, ty)]) continue;
    solid[S(tx, ty)] = 1;
    decos.push({ spr: 'rock', x: tx * TILE + 3, y: ty * TILE + 5 });
    placed++;
  }
  // 草丛装饰（不碰撞）
  for (let i = 0; i < 130; i++) {
    const tx = 2 + Math.floor(rnd() * (MAPW - 4)), ty = 2 + Math.floor(rnd() * (MAPH - 4));
    decos.push({ spr: 'tuft', x: tx * TILE + 4 + Math.floor(rnd() * 6), y: ty * TILE + 6 + Math.floor(rnd() * 6) });
  }
  // 出生点周围清空（地图中央偏左）
  clearAround(10, 20, 5);
  // 画静态层
  // 草丛小笔触
  const drawTuft = (x, y) => {
    g.fillStyle = '#3f6b33';
    g.fillRect(x, y, 1, 3); g.fillRect(x + 2, y - 1, 1, 4); g.fillRect(x + 4, y, 1, 3);
    g.fillStyle = '#54893f';
    g.fillRect(x + 1, y + 1, 1, 2); g.fillRect(x + 3, y, 1, 3);
  };
  // 地面碎花点缀
  for (let i = 0; i < 200; i++) {
    const x = Math.floor(rnd() * WORLD_W), y = Math.floor(rnd() * WORLD_H);
    g.fillStyle = rnd() > .5 ? '#3c6231' : '#26401f';
    g.fillRect(x, y, 2, 1);
  }
  // 先画树/石底再画草丛（装饰统一在实体渲染时按 y 排序画，这里只画草）
  for (const d of decos) if (d.spr === 'tuft') drawTuft(d.x, d.y);
  // 把树和石头从 decos 移除，实体渲染阶段按 y 排序绘制（有遮挡感）
  G.trees = decos.filter(d => d.spr !== 'tuft');
}
function isSolid(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (tx < 0 || ty < 0 || tx >= MAPW || ty >= MAPH) return true;
  return solid[ty * MAPW + tx] === 1;
}
function moveEntity(e, dx, dy) {
  // 分轴移动 + 四角碰撞（bbox 半宽 hw 半高 hh）
  const test = (x, y) => isSolid(x - e.hw, y - e.hh) || isSolid(x + e.hw, y - e.hh) ||
                         isSolid(x - e.hw, y + e.hh) || isSolid(x + e.hw, y + e.hh);
  if (!test(e.x + dx, e.y)) e.x += dx;
  if (!test(e.x, e.y + dy)) e.y += dy;
}

// ---------- 输入 ----------
const keys = {};
addEventListener('keydown', ev => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(ev.key)) ev.preventDefault();
  keys[ev.code] = true;
  onPress(ev.code);
});
addEventListener('keyup', ev => keys[ev.code] = false);
cv.addEventListener('mousedown', () => { if (G.state === 'play') tryAttack(); else onPress('Enter'); });
const axis = () => {
  let x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let y = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (x && y) { x *= 0.7071; y *= 0.7071; }
  return [x, y];
};

// ---------- 实体 ----------
const P = {
  x: 10 * TILE, y: 20 * TILE, hw: 5, hh: 5,
  hp: 20, maxHp: 20, level: 1, xp: 0, coins: 0,
  speed: 88, dmg: 4,
  faceX: 1, faceY: 0,
  atkCd: 0, atkT: 0,           // 攻击冷却 / 挥砍动画计时
  rollT: 0, rollCd: 0, invT: 0,
  animT: 0, kvx: 0, kvy: 0,    // 击退速度
};
const G = {
  state: 'title',              // title | play | dead | win
  time: 0, playTime: 0,
  kills: 0, bossDead: false,
  enemies: [], drops: [], parts: [], texts: [],
  boss: null, bossSpawnAt: 12,
  spawnT: 2, shake: 0,
  trees: [], toast: null, toastT: 0,
  camX: 0, camY: 0,
};

function spawnEnemy(kind = 'slime', x, y) {
  const e = {
    kind, x, y, hw: 4, hh: 4,
    hp: kind === 'boss' ? 160 : 8 + Math.floor(G.kills * 0.8),
    maxHp: kind === 'boss' ? 160 : 8 + Math.floor(G.kills * 0.8),
    speed: kind === 'boss' ? 34 : 34,
    dmg: kind === 'boss' ? 7 : 3,
    vx: 0, vy: 0, dir: 1,
    hopT: Math.random() * 1.2, flashT: 0,
    state: 'idle', dashT: 0, dashCd: 3.5, summonCd: 6,
    boss: kind === 'boss',
  };
  if (kind === 'boss') { e.hw = 14; e.hh = 11; G.boss = e; }
  G.enemies.push(e);
  return e;
}
function randSpawnNearPlayer(minD, maxD) {
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const d = minD + Math.random() * (maxD - minD);
    const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
    if (x < 40 || y < 40 || x > WORLD_W - 40 || y > WORLD_H - 40) continue;
    if (isSolid(x, y) || isSolid(x + 6, y) || isSolid(x - 6, y) || isSolid(x, y + 6)) continue;
    return [x, y];
  }
  return null;
}
function drop(x, y, type) { G.drops.push({ x, y, type, t: 0, vx: (Math.random()-.5)*40, vy: (Math.random()-.5)*40 }); }
function fx(x, y, color, n = 6, sp = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = sp * (0.4 + Math.random() * 0.8);
    G.parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: .35 + Math.random()*.25, t: 0, color });
  }
}
function floatText(x, y, str, color = '#fff') { G.texts.push({ x, y, str, color, t: 0 }); }
function toast(msg, dur = 2.2) { G.toast = msg; G.toastT = dur; }

// ---------- 战斗 ----------
function tryAttack() {
  if (P.atkCd > 0 || G.state !== 'play') return;
  P.atkCd = 0.34; P.atkT = 0.16;
  SFX.swing();
  const range = 26, arc = 1.15; // 弧度半角
  const fa = Math.atan2(P.faceY, P.faceX);
  const hitList = G.enemies.slice();
  if (G.boss && !hitList.includes(G.boss)) hitList.push(G.boss);
  for (const e of hitList) {
    if (e.hp <= 0) continue;
    const dx = e.x - P.x, dy = (e.y - P.y);
    const d = Math.hypot(dx, dy);
    if (d > range + e.hw) continue;
    let da = Math.atan2(dy, dx) - fa;
    while (da > Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    if (Math.abs(da) > arc) continue;
    damageEnemy(e, P.dmg + Math.floor(Math.random() * 2), dx / (d||1), dy / (d||1));
  }
}
function damageEnemy(e, dmg, kx, ky) {
  e.hp -= dmg; e.flashT = 0.12;
  e.vx += kx * 90; e.vy += ky * 90;
  floatText(e.x, e.y - 12, '' + dmg, '#ffd76e');
  fx(e.x, e.y, e.boss ? '#7fd45c' : '#7fd45c', 5);
  SFX.hit();
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  const idx = G.enemies.indexOf(e);
  if (idx >= 0) G.enemies.splice(idx, 1);
  G.kills++;
  fx(e.x, e.y, '#7fd45c', 14, 90);
  gainXp(e.boss ? 60 : 5);
  const n = e.boss ? 25 : 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) drop(e.x, e.y, 'coin');
  if (Math.random() < (e.boss ? 1 : 0.22)) drop(e.x, e.y, 'heart');
  if (e.boss) {
    G.boss = null; G.bossDead = true;
    G.state = 'win'; SFX.win(); writeSave();
    return;
  }
  if (G.kills === G.bossSpawnAt && !G.boss && !G.bossDead) {
    const pos = randSpawnNearPlayer(120, 160);
    if (pos) {
      spawnEnemy('boss', pos[0], pos[1]);
      toast('⚠ 史莱姆王出现了！', 3);
      SFX.boss(); G.shake = 0.5;
    }
  }
  writeSave();
}
function gainXp(n) {
  P.xp += n;
  let need = xpNeed();
  while (P.xp >= need) {
    P.xp -= need; P.level++;
    P.maxHp += 5; P.hp = P.maxHp; P.dmg += 2;
    need = xpNeed();
    toast('★ 升级！Lv.' + P.level + '  HP+' + 5 + ' 攻击+' + 2, 2.5);
    SFX.level();
    fx(P.x, P.y, '#ffd76e', 18, 80);
  }
}
const xpNeed = () => Math.floor(18 * Math.pow(P.level, 1.35));
function hurtPlayer(dmg, kx, ky) {
  if (P.invT > 0 || P.rollT > 0 || G.state !== 'play') return;
  P.hp -= dmg; P.invT = 0.7;
  P.kvx = (P.kvx || 0) + kx * 120; P.kvy = (P.kvy || 0) + ky * 120;
  floatText(P.x, P.y - 14, '-' + dmg, '#ff6a5e');
  fx(P.x, P.y, '#e8483c', 8);
  G.shake = 0.25; SFX.hurt();
  if (P.hp <= 0) { P.hp = 0; G.state = 'dead'; writeSave(); }
}

// ---------- 更新 ----------
function onPress(code) {
  if (G.state === 'title') {
    if (code === 'Digit1' || code === 'Enter' || code === 'NumpadEnter') startGame(false);
    if (code === 'Digit2' && loadSave()) startGame(true);
  } else if (G.state === 'dead') {
    if (code === 'KeyR' || code === 'Enter') respawn();
  } else if (G.state === 'win') {
    if (code === 'KeyC' || code === 'Enter') { G.state = 'play'; }
    if (code === 'KeyN') { clearSave(); location.reload(); }
  } else if (G.state === 'play') {
    if ((code === 'KeyJ' || code === 'Space')) tryAttack();
    if (code === 'ShiftLeft' || code === 'ShiftRight') tryRoll();
  }
}
function tryRoll() {
  if (P.rollCd > 0) return;
  const [ax, ay] = axis();
  P.rollDX = ax || P.faceX; P.rollDY = ay || P.faceY;
  P.rollT = 0.22; P.rollCd = 0.8;
  beep(240, 420, .1, 'sine', .05);
}
function startGame(cont) {
  if (cont) {
    const s = loadSave();
    if (s) {
      P.level = s.level; P.xp = s.xp; P.coins = s.coins;
      P.maxHp = 20 + (P.level - 1) * 5; P.hp = P.maxHp;
      P.dmg = 4 + (P.level - 1) * 2;
      G.kills = s.kills || 0; G.bossDead = !!s.bossDead;
      G.playTime = s.playTime || 0;
    }
  } else { clearSave(); }
  G.state = 'play';
  G.enemies.length = 0; G.drops.length = 0; G.boss = null;
  G.spawnT = 1;
  toast(cont ? '欢迎回来，勇者！' : '冒险开始！击杀史莱姆收集经验吧', 2.5);
}
function respawn() {
  P.hp = P.maxHp;
  P.x = 10 * TILE; P.y = 20 * TILE; P.invT = 1.2;
  G.enemies.length = 0; G.drops.length = 0; G.boss = null;
  G.spawnT = 2.5;
  G.state = 'play';
  toast('勇者不死！再次出击', 2);
}

function update(dt) {
  G.time += dt;
  if (G.state !== 'play') return;
  G.playTime += dt;
  if (G.toastT > 0) G.toastT -= dt;
  if (G.shake > 0) G.shake -= dt;

  // ---- 玩家 ----
  P.atkCd = Math.max(0, P.atkCd - dt);
  P.atkT = Math.max(0, P.atkT - dt);
  P.rollCd = Math.max(0, P.rollCd - dt);
  P.invT = Math.max(0, P.invT - dt);
  const [ax, ay] = axis();
  if (P.rollT > 0) {
    P.rollT -= dt;
    moveEntity(P, P.rollDX * 210 * dt, P.rollDY * 210 * dt);
    fx(P.x, P.y + 4, '#cfd2dd', 1, 20);
  } else {
    if (ax || ay) {
      if (ax) { P.faceX = Math.sign(ax); P.faceY = 0; }   // 横向优先
      else { P.faceX = 0; P.faceY = Math.sign(ay); }      // 纵向
      moveEntity(P, ax * P.speed * dt, ay * P.speed * dt);
      P.animT += dt;
    }
  }
  // 击退衰减（简单速度场）
  if (P.kvx) { moveEntity(P, P.kvx * dt, P.kvy * dt); P.kvx *= 0.0001 ** dt; P.kvy *= 0.0001 ** dt;
    if (Math.abs(P.kvx) < 4) P.kvx = P.kvy = 0; }

  // ---- 敌人生成 ----
  if (!G.boss && !G.bossDead && G.kills < G.bossSpawnAt) {
    G.spawnT -= dt;
    if (G.spawnT <= 0 && G.enemies.length < 7) {
      G.spawnT = 2.2 + Math.random();
      const pos = randSpawnNearPlayer(130, 240);
      if (pos) spawnEnemy('slime', pos[0], pos[1]);
    }
  }

  // ---- 敌人 AI ----
  for (const e of G.enemies) {
    e.flashT = Math.max(0, e.flashT - dt);
    // 击退
    if (Math.abs(e.vx) > 2 || Math.abs(e.vy) > 2) {
      moveEntity(e, e.vx * dt, e.vy * dt);
      e.vx *= 0.0001 ** dt; e.vy *= 0.0001 ** dt;
    }
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy);
    if (e.boss) {
      // Boss：追踪 + 蓄力冲刺 + 半血召唤
      e.dashCd -= dt;
      if (e.state === 'telegraph') {
        e.dashT -= dt;
        if (e.dashT <= 0) {
          e.state = 'dash'; e.dashT = 0.5;
          const dd = Math.max(1, d);
          e.vx = dx / dd * 260; e.vy = dy / dd * 260;
          beep(90, 200, .2, 'sawtooth', .08);
        }
      } else if (e.state === 'dash') {
        e.dashT -= dt;
        moveEntity(e, e.vx * dt, e.vy * dt);
        e.vx *= 0.01 ** dt; e.vy *= 0.01 ** dt;
        if (e.dashT <= 0) { e.state = 'idle'; e.dashCd = 3 + Math.random(); }
      } else {
        if (d > 4) { const dd = d; moveEntity(e, dx / dd * e.speed * dt, dy / dd * e.speed * dt); }
        if (e.dashCd <= 0) { e.state = 'telegraph'; e.dashT = 0.55; }
      }
      if (e.hp < e.maxHp * 0.5) {
        e.summonCd -= dt;
        if (e.summonCd <= 0) {
          e.summonCd = 8;
          for (let i = 0; i < 2; i++) {
            const pos = randSpawnNearPlayer(40, 80);
            if (pos) spawnEnemy('slime', pos[0], pos[1]);
          }
          toast('史莱姆王召唤了小怪！', 1.6);
        }
      }
    } else {
      // 小怪：跳跃式追踪
      e.hopT -= dt;
      if (d < 110) {
        const hop = Math.max(0, Math.sin(Math.max(0, e.hopT) * 6));
        const sp = e.speed * (0.4 + hop * 1.1);
        if (d > 6) { moveEntity(e, dx / d * sp * dt, dy / d * sp * dt); }
      } else {
        // 游荡
        if (e.hopT <= 0) {
          e.hopT = 0.8 + Math.random() * 1.2;
          const a = Math.random() * Math.PI * 2;
          e.wanderX = Math.cos(a); e.wanderY = Math.sin(a);
        }
        if (e.wanderX) moveEntity(e, (e.wanderX||0) * 16 * dt, (e.wanderY||0) * 16 * dt);
      }
    }
    // 接触伤害
    if (Math.abs(P.x - e.x) < P.hw + e.hw && Math.abs(P.y - e.y) < P.hh + e.hh + 2) {
      const dd = Math.max(1, Math.hypot(dx, dy));
      hurtPlayer(e.dmg, -dx / dd, -dy / dd);
    }
  }

  // ---- 掉落物 ----
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const dr = G.drops[i];
    dr.t += dt;
    moveEntity({ hw: 2, hh: 2, x: (dr.x += dr.vx * dt), y: (dr.y += dr.vy * dt) }, 0, 0);
    dr.vx *= 0.02 ** dt; dr.vy *= 0.02 ** dt;
    const d = Math.hypot(P.x - dr.x, P.y - dr.y);
    if (dr.t > 0.3 && d < 14) { // 磁吸
      dr.x += (P.x - dr.x) * 6 * dt; dr.y += (P.y - dr.y) * 6 * dt;
    }
    if (dr.t > 0.35 && d < 7) {
      if (dr.type === 'coin') { P.coins += 1; SFX.coin(); floatText(dr.x, dr.y - 6, '+1', '#ffd76e'); }
      else if (dr.type === 'heart') { P.hp = Math.min(P.maxHp, P.hp + 6); SFX.pickup(); floatText(dr.x, dr.y - 6, '+HP', '#7fd45c'); }
      G.drops.splice(i, 1); writeSave();
    }
  }

  // ---- 粒子 / 飘字 ----
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt;
    if (p.t > p.life) G.parts.splice(i, 1);
  }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i]; t.t += dt; t.y -= 22 * dt;
    if (t.t > 0.7) G.texts.splice(i, 1);
  }

  // ---- 相机 ----
  G.camX += (P.x - W / 2 - G.camX) * Math.min(1, 8 * dt);
  G.camY += (P.y - H / 2 - G.camY) * Math.min(1, 8 * dt);
  G.camX = Math.max(0, Math.min(WORLD_W - W, G.camX));
  G.camY = Math.max(0, Math.min(WORLD_H - H, G.camY));
}

// ---------- 渲染 ----------
function drawSpr(spr, x, y, flip = false) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(spr, -spr.width >> 1, -spr.height + 2);
  ctx.restore();
}
function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(Math.round(x), Math.round(y) + 2, w, w * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
}
function render() {
  const shx = G.shake > 0 ? (Math.random() - .5) * 5 * G.shake : 0;
  const shy = G.shake > 0 ? (Math.random() - .5) * 5 * G.shake : 0;
  const cx = Math.round(G.camX + shx), cy = Math.round(G.camY + shy);

  ctx.fillStyle = '#1a2417'; ctx.fillRect(0, 0, W, H);
  if (G.state === 'title') { drawTitle(); return; }

  ctx.save();
  ctx.translate(-cx, -cy);
  ctx.drawImage(mapCanvas, 0, 0);

  // 收集可排序绘制物：树石 + 敌人 + 玩家 + 掉落物
  const draws = [];
  for (const t of G.trees) draws.push({ y: t.y + 20, f: () => drawSpr(SPR[t.spr], t.x + 8, t.y + 22) });
  for (const dr of G.drops) {
    const bob = Math.sin(G.time * 5 + dr.x) * 1.5;
    draws.push({ y: dr.y, f: () => { drawShadow(dr.x, dr.y, 3); drawSpr(SPR[dr.type], dr.x, dr.y + bob); } });
  }
  for (const e of G.enemies) {
    draws.push({ y: e.y + (e.boss ? 12 : 4), f: () => {
      drawShadow(e.x, e.y + (e.boss ? 10 : 3), e.boss ? 14 : 5);
      if (e.boss) {
        const s = 4;
        const telegraph = e.state === 'telegraph' && Math.sin(G.time * 30) > 0;
        const bossW = whiteOfCache || (whiteOfCache = whiteOf(SPR.slime));
        drawSprScaled(telegraph || e.flashT > 0 ? bossW : SPR.slime, e.x, e.y + 10, s, e.vx < 0);
        // 王冠
        ctx.fillStyle = '#ffd76e';
        const bx = Math.round(e.x - s * 5 / 2), by = Math.round(e.y + 10 - s * 8 - 4);
        ctx.fillRect(bx + 3, by, s * 4, 3);
        ctx.fillRect(bx + 3, by - 3, 2, 3); ctx.fillRect(bx + 8, by - 4, 2, 4); ctx.fillRect(bx + 13, by - 3, 2, 3);
        // Boss 血条
        const bw = 44;
        ctx.fillStyle = '#26262e'; ctx.fillRect(e.x - bw / 2 - 1, e.y - 30, bw + 2, 5);
        ctx.fillStyle = '#e8483c'; ctx.fillRect(e.x - bw / 2, e.y - 29, bw * Math.max(0, e.hp / e.maxHp), 3);
      } else {
        const bob = Math.abs(Math.sin(G.time * 6 + e.x)) * 2;
        drawSpr(e.flashT > 0 ? SPR.slimeW : SPR.slime, e.x, e.y - bob + 3, e.vx < 0);
      }
    }});
  }
  draws.push({ y: P.y, f: drawPlayer });
  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) d.f();

  // 粒子
  for (const p of G.parts) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2);
  }
  ctx.globalAlpha = 1;
  // 飘字
  ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
  for (const t of G.texts) {
    ctx.globalAlpha = 1 - t.t / 0.7;
    ctx.fillStyle = '#000'; ctx.fillText(t.str, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color; ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHud();
  if (G.toastT > 0 && G.toast) {
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    const tw = ctx.measureText(G.toast).width + 20;
    ctx.fillStyle = 'rgba(20,22,32,0.85)';
    ctx.fillRect(W / 2 - tw / 2, 30, tw, 16);
    ctx.strokeStyle = '#ffd76e'; ctx.lineWidth = 1;
    ctx.strokeRect(W / 2 - tw / 2 + .5, 30.5, tw - 1, 15);
    ctx.fillStyle = '#ffd76e'; ctx.fillText(G.toast, W / 2, 41);
  }
  if (G.state === 'dead') drawOverlay('你 被 击 败 了', '按 R 重新站起来（进度已保存）', '#ff6a5e');
  if (G.state === 'win') drawWin();
}
let whiteOfCache = null;
function drawSprScaled(spr, x, y, s, flip) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(spr, -spr.width * s / 2, -spr.height * s + 2, spr.width * s, spr.height * s);
  ctx.restore();
}
function drawPlayer() {
  const bob = (keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD || keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight)
    ? Math.abs(Math.sin(P.animT * 10)) * 1.5 : 0;
  if (P.invT > 0 && Math.sin(G.time * 40) > 0) return; // 受击闪烁
  drawShadow(P.x, P.y + 5, 5);
  // 翻滚残影姿态
  const rolling = P.rollT > 0;
  ctx.save();
  if (rolling) { ctx.translate(P.x, P.y - 4); ctx.rotate((1 - P.rollT / 0.22) * Math.PI * 2 * Math.sign(P.faceX || 1)); ctx.translate(-P.x, -(P.y - 4)); }
  drawSpr(SPR.player, P.x, P.y - bob + 3, P.faceX < 0);
  ctx.restore();
  // 挥砍弧
  if (P.atkT > 0) {
    const fa = Math.atan2(P.faceY, P.faceX);
    const prog = 1 - P.atkT / 0.16;
    const a0 = fa - 1.2 + prog * 2.4;
    ctx.strokeStyle = '#eef2ff';
    ctx.lineWidth = 3; ctx.globalAlpha = 1 - prog * 0.6;
    ctx.beginPath();
    ctx.arc(P.x, P.y - 3, 20, a0 - 0.5, a0 + 0.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function drawHud() {
  // HP 条
  const bw = 70;
  ctx.fillStyle = 'rgba(15,17,26,0.8)'; ctx.fillRect(8, 8, bw + 4, 10);
  ctx.fillStyle = '#26262e'; ctx.fillRect(10, 10, bw, 6);
  ctx.fillStyle = P.hp / P.maxHp > 0.3 ? '#5ad45c' : '#e8483c';
  ctx.fillRect(10, 10, bw * Math.max(0, P.hp / P.maxHp), 6);
  ctx.font = '6px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#e8eaf2';
  ctx.fillText('Lv.' + P.level + '  ' + Math.ceil(P.hp) + '/' + P.maxHp, 10, 26);
  // XP 条
  ctx.fillStyle = 'rgba(15,17,26,0.8)'; ctx.fillRect(8, 29, bw + 4, 6);
  ctx.fillStyle = '#2f9a9a';
  ctx.fillRect(10, 30.5, bw * Math.min(1, P.xp / xpNeed()), 3);
  // 金币 / 击杀
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd76e'; ctx.fillText('◉ ' + P.coins, 84, 15);
  ctx.fillStyle = '#cfd2dd';
  ctx.fillText('击杀 ' + G.kills + (G.bossDead ? ' ✓通关' : ' / ' + G.bossSpawnAt), 84, 26);
  ctx.font = '7px monospace';
  // 操作提示（右下角淡出）
  ctx.globalAlpha = 0.5; ctx.textAlign = 'right'; ctx.fillStyle = '#cfd2dd';
  ctx.fillText('J攻击 · Shift翻滚', W - 8, H - 8);
  ctx.globalAlpha = 1;
}
function drawTitle() {
  ctx.fillStyle = '#141a30'; ctx.fillRect(0, 0, W, H);
  // 星空
  const rnd = mulberry32(7);
  for (let i = 0; i < 60; i++) {
    ctx.fillStyle = rnd() > .5 ? '#3a4266' : '#525a80';
    ctx.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * H * 0.7), 1, 1);
  }
  // 地面剪影
  ctx.fillStyle = '#10151f'; ctx.fillRect(0, H - 40, W, 40);
  for (let i = 0; i < 8; i++) drawSpr(SPR.tree, 20 + i * 62, H - 16 + Math.sin(i) * 2);
  // 主角大图
  ctx.save();
  ctx.translate(W / 2 - 60, H / 2 - 20); ctx.scale(4, 4);
  ctx.drawImage(SPR.player, -6, -14);
  ctx.restore();
  ctx.save();
  ctx.translate(W / 2 + 55, H / 2 - 6); ctx.scale(4, 4);
  ctx.drawImage(SPR.slime, -5, -8);
  ctx.restore();
  ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd76e'; ctx.fillText('周 目 勇 者', W / 2, 66);
  ctx.font = '9px monospace'; ctx.fillStyle = '#8a8fa3';
  ctx.fillText('—— 像素风动作 RPG · 原型 ——', W / 2, 82);
  const hasSave = !!loadSave();
  ctx.font = '11px monospace';
  ctx.fillStyle = Math.sin(G.time * 4) > -0.3 ? '#eef2ff' : '#6a7089';
  ctx.fillText(hasSave ? '[ 1 ] 新的冒险' : '[ 1 ] 开始冒险', W / 2, H - 66);
  if (hasSave) {
    const s = loadSave();
    ctx.fillStyle = Math.sin(G.time * 4) > -0.3 ? '#7fd45c' : '#3e5b3a';
    ctx.fillText('[ 2 ] 继续冒险  (Lv.' + s.level + ' · ' + (s.coins||0) + ' 金币 · 击杀 ' + (s.kills||0) + ')', W / 2, H - 48);
  }
  ctx.fillStyle = '#565c78'; ctx.font = '8px monospace';
  ctx.fillText('WASD 移动 · J/空格 攻击 · Shift 翻滚', W / 2, H - 26);
}
function drawOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(10,10,16,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px monospace'; ctx.fillStyle = color;
  ctx.fillText(title, W / 2, H / 2 - 14);
  ctx.font = '10px monospace'; ctx.fillStyle = '#cfd2dd';
  ctx.fillText(sub, W / 2, H / 2 + 10);
}
function drawWin() {
  ctx.fillStyle = 'rgba(10,14,10,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px monospace'; ctx.fillStyle = '#ffd76e';
  ctx.fillText('★ 讨 伐 成 功 ★', W / 2, H / 2 - 30);
  ctx.font = '10px monospace'; ctx.fillStyle = '#cfd2dd';
  const m = Math.floor(G.playTime / 60), s = Math.floor(G.playTime % 60);
  ctx.fillText('史莱姆王已被击败！', W / 2, H / 2 - 6);
  ctx.fillText('等级 Lv.' + P.level + ' · 金币 ' + P.coins + ' · 总击杀 ' + G.kills + ' · 用时 ' + m + '分' + s + '秒', W / 2, H / 2 + 12);
  ctx.fillStyle = Math.sin(G.time * 4) > -0.3 ? '#eef2ff' : '#6a7089';
  ctx.fillText('[ C ] 继续自由探索      [ N ] 重开新周目', W / 2, H / 2 + 38);
}

// ---------- 主循环 ----------
buildMap();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
